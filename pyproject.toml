[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-cdp-api"
version = "1.1.0"
description = "FastAPI backend and interactive terminal CLI to control Google Gemini Web via Chrome DevTools Protocol (CDP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GEMINI-API Contributors" }
]
keywords = ["gemini", "cdp", "fastapi", "playwright", "chrome", "cli", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "playwright>=1.42.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sse-starlette>=2.0.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "httpx>=0.27.0"
]

[project.scripts]
gemini-api = "run:main"
gemini-cli = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "cli*"]
